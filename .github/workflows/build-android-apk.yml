name: Build Android APK (dublagem)

on:
  workflow_dispatch:
  push:
    branches: [feature/dublagem-legenda]

jobs:
  apk:
    name: Debug APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependências do gerador nanopb
        run: pip install protobuf grpcio-tools

      - name: NDK e CMake do Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Rodar testes da lógica Kotlin
        working-directory: android
        run: ./gradlew testDebugUnitTest --tests 'com.metallic.chiaki.dub.*' --no-daemon

      - name: Compilar APK debug (arm64-v8a)
        working-directory: android
        run: ./gradlew assembleDebug -Pandroid.injected.build.abi=arm64-v8a --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: chiaki-dublagem-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
