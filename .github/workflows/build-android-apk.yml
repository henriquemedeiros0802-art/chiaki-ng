name: Build Android APK (dublagem)

on:
  workflow_dispatch:
  push:
    branches: [feature/dublagem-legenda]

permissions:
  contents: write

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: NDK e CMake do Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Ferramentas do nanopb (protoc)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler python3-protobuf ninja-build
          protoc --version

      - name: Assinar com chave fixa (novas versões instalam por cima das antigas)
        run: |
          printf 'chiakiKeystore=../ci-debug.keystore\nchiakiKeystorePW=android\nchiakiKeyAlias=dublador\nchiakiKeyPW=android\n' > android/local.properties

      - name: Testes da lógica Kotlin da dublagem
        working-directory: android
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --tests 'com.metallic.chiaki.dub.*' --no-daemon

      - name: Compilar APK debug
        working-directory: android
        shell: bash
        run: |
          for i in 1 2 3; do
            ./gradlew assembleDebug --no-daemon 2>&1 | tee ../build.log
            rc=${PIPESTATUS[0]}
            [ "$rc" = "0" ] && exit 0
            echo "tentativa $i falhou ($rc), tentando de novo"; sleep 15
          done
          exit 1

      - name: Resumo dos erros
        if: failure()
        run: |
          grep -nE "^e: |error:|What went wrong|FAILED|Could not|not found|Unresolved" build.log | head -25 | cut -c1-400 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Renomear APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/*.apk out/dublagem-ps5-build-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dublagem-ps5-apk
          path: out/dublagem-ps5-build-${{ github.run_number }}.apk

      - name: Publicar APK numa release (baixe pelo celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dublagem-build-${{ github.run_number }}
          name: Dublagem PS5 build ${{ github.run_number }}
          files: out/dublagem-ps5-build-${{ github.run_number }}.apk
          prerelease: true
