name: Android APK (dublador)

on:
  workflow_dispatch:
  push:
    branches: [dublador]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK and CMake
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls "$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Tools for nanopb (protoc)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler python3-protobuf ninja-build
          protoc --version

      - name: Write build number into the app
        run: |
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="dub_build" translatable="false">${{ github.run_number }}</string>\n</resources>\n' > android/app/src/main/res/values/build_info.xml

      - name: Use fixed signing key (so new builds install over old ones)
        run: |
          printf 'chiakiKeystore=../ci-debug.keystore\nchiakiKeystorePW=android\nchiakiKeyAlias=dublador\nchiakiKeyPW=android\n' > android/local.properties
          cat android/local.properties

      - name: Build debug APK
        working-directory: android
        run: |
          for i in 1 2 3; do
            ./gradlew assembleDebug --no-daemon 2>&1 | tee ../build.log
            rc=${PIPESTATUS[0]}
            [ "$rc" = "0" ] && exit 0
            echo "attempt $i failed ($rc), retrying"; sleep 15
          done
          exit 1
        shell: bash

      - name: Report errors
        if: failure()
        run: |
          grep -nE "^e: |error:|What went wrong|FAILED|Could not|not found|Unresolved" build.log | head -25 | cut -c1-400 | while IFS= read -r l; do echo "::error::$l"; done
          tail -n 15 build.log | cut -c1-300 | while IFS= read -r l; do echo "::warning::$l"; done

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/*.apk out/dublador-ps5-build-${{ github.run_number }}.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: dublador-ps5-apk
          path: out/dublador-ps5-build-${{ github.run_number }}.apk

      - name: Publish release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dublador-build-${{ github.run_number }}
          name: Dublador PS5 build ${{ github.run_number }}
          files: out/dublador-ps5-build-${{ github.run_number }}.apk
          prerelease: true
